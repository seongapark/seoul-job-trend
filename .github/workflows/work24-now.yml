name: work24 collect now
on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: collect

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: work24 OPIA (구인구직) 24개월 수집
        working-directory: scripts
        env:
          N_MONTHS: "24"
          WITH_OPIB: "0"
          WORKERS: "8"
        run: python collect_work24.py
      - name: 대시보드 JSON 생성
        working-directory: scripts
        run: python build_data.py
      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "work24 OPIA initial collect"
          git push

name: network diag
on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: diagnose
        run: |
          echo "== runner IP =="
          curl -s -m 15 https://api.ipify.org
          echo
          echo "== eis.work24.go.kr OPIA =="
          curl -sS -o /dev/null -w "connect=%{time_connect}s total=%{time_total}s http=%{http_code}" --connect-timeout 15 -m 40 "https://eis.work24.go.kr/opi/joApi.do?apiSecd=OPIA&rsdAreaCd=11680&sxdsCd=M&ageCd=06&rernSecd=XML&closStdrYm=202606&bgnPage=1&display=10" || echo "FAILED exit=$?"
          echo
          echo "== oapi.saramin.co.kr =="
          curl -sS -o /dev/null -w "connect=%{time_connect}s total=%{time_total}s http=%{http_code}" --connect-timeout 15 -m 40 "https://oapi.saramin.co.kr/" || echo "FAILED exit=$?"
          echo
          echo "== kosis.kr control =="
          curl -sS -o /dev/null -w "connect=%{time_connect}s total=%{time_total}s http=%{http_code}" --connect-timeout 15 -m 40 "https://kosis.kr/" || echo "FAILED exit=$?"
          echo
          echo "== www.work24.go.kr control =="
          curl -sS -o /dev/null -w "connect=%{time_connect}s total=%{time_total}s http=%{http_code}" --connect-timeout 15 -m 40 "https://www.work24.go.kr/" || echo "FAILED exit=$?"
          echo

name: daily collect

on:
  schedule:
    - cron: "0 21 * * *"      # UTC 21:00 = KST 06:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 사람인 키가 아직 없어도 work24는 계속 받도록 실패를 무시한다
      - name: 사람인 일별 공고수 수집
        continue-on-error: true
        working-directory: scripts
        env:
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
        run: python collect_saramin.py

      # N_MONTHS=24 + 이어받기 → IP 일일 한도에 걸릴 때까지 받고, 며칠에 걸쳐 24개월을 채운다
      - name: work24 수집 (이어받기)
        continue-on-error: true
        working-directory: scripts
        env:
          N_MONTHS: "24"
          WORKERS: "3"
        run: python collect_work24.py

      - name: 대시보드 JSON 생성
        working-directory: scripts
        run: python build_data.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git pull --rebase origin main || true
          git diff --staged --quiet || git commit -m "data: $(date -u -d '+9 hours' +%Y-%m-%d)"
          git pull --rebase origin main
          git push
